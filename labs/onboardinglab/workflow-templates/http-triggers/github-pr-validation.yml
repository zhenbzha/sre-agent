name: SRE Agent PR validation

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Send commit-pinned PR evidence to SRE Agent
        env:
          GH_TOKEN: ${{ github.token }}
          WEBHOOK_URL: ${{ secrets.SRE_AGENT_WEBHOOK_URL }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$WEBHOOK_URL"
          tmp="$(mktemp -d "$RUNNER_TEMP/sre-pr.XXXXXX")"
          trap 'rm -f "$tmp/collector.py" "$tmp/payload.json"; rmdir "$tmp"' EXIT
          # Fetch trusted workflow code, never a helper from the PR branch.
          gh api -H 'Accept: application/vnd.github.raw+json' \
            "repos/$GITHUB_REPOSITORY/contents/labs/onboardinglab/scripts/internal/build-pr-validation-payload.py?ref=$WORKFLOW_SHA" \
            > "$tmp/collector.py"
          python3 "$tmp/collector.py" > "$tmp/payload.json"
          curl --fail --silent --show-error --output /dev/null \
            --connect-timeout 10 --max-time 60 \
            --retry 2 --retry-all-errors \
            --header 'Content-Type: application/json' \
            --data-binary "@$tmp/payload.json" "$WEBHOOK_URL"
